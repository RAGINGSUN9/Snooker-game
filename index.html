<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snooker Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎱 Snooker Game</h1>
        </header>
        
        <div class="game-area">
            <div class="score-panel">
                <div class="player-score">
                    <h3>Player 1</h3>
                    <div class="score-value" id="player1-score">0</div>
                </div>
                <div class="game-info">
                    <div class="current-player" id="current-player">Player 1's Turn</div>
                    <div class="break-score" id="break-score">Break: 0</div>
                    <button id="reset-btn" class="btn">New Game</button>
                </div>
                <div class="player-score">
                    <h3>Player 2</h3>
                    <div class="score-value" id="player2-score">0</div>
                </div>
            </div>
            
            <div class="canvas-container">
                <canvas id="gameCanvas"></canvas>
                <div class="aiming-line" id="aiming-line"></div>
            </div>
            
            <div class="controls">
                <div class="power-meter">
                    <label>Power:</label>
                    <div class="meter-bar">
                        <div class="meter-fill" id="power-meter"></div>
                    </div>
                    <span id="power-value">0%</span>
                </div>
                <div class="instructions">
                    <p><strong>Instructions:</strong></p>
                    <p>Click and drag to aim, release to shoot</p>
                    <p>Red balls = 1 point, Yellow = 2, Green = 3, Brown = 4, Blue = 5, Pink = 6, Black = 7</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
